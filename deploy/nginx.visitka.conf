# Прокси на Next.js (pm2): PORT=3200
# Подставь свой домен вместо example.com, затем:
#   cp deploy/nginx.visitka.conf /etc/nginx/sites-available/visitka
#   ln -sf /etc/nginx/sites-available/visitka /etc/nginx/sites-enabled/visitka
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d example.com

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
